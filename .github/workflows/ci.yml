name: CI
on:
  push: 
  pull_request:
  workflow_dispatch:

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip3 install homeassistant
      # Pinned to a minor series: the workflow used to install whatever ruff
      # was newest, so a release that only added rules turned this job red
      # without a single line changing here.
      - run: pip3 install 'ruff~=0.16.0'
      - run: ruff check
      - run: ruff format